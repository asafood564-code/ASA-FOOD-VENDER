<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASA FOOD Grocery - Quality Essentials</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase_client.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #FFFFFF;
            color: #1A1A1A;
            font-family: 'Outfit', sans-serif;
        }
        .header-yellow {
            background-color: #FFD700;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
        }
        .search-container {
            transform: translateY(0);
        }
        .category-scroll {
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 8px;
        }
        .category-scroll::-webkit-scrollbar {
            display: none;
        }
        .category-card {
            flex: 0 0 auto;
            width: 90px;
            text-align: center;
        }
        .product-card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #F5F5F5;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:active {
            transform: scale(0.97);
        }
        .add-btn {
            background-color: #FFD700;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .active-dot {
            width: 18px;
            height: 4px;
            background: #000;
            border-radius: 2px;
            position: absolute;
            bottom: -6px;
        }
        /* Advanced Header & Search Sticky Mode */
        header {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #header-top-row {
            max-height: 100px;
            transform: translateY(0);
            opacity: 1;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease-out, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        header.active-header {
            padding-top: 8px !important;
            padding-bottom: 8px !important;
        }
        header.active-header #header-top-row {
            max-height: 0 !important;
            margin-bottom: 0 !important;
            opacity: 0 !important;
            transform: translateY(-20px) !important;
            pointer-events: none;
        }
        header.active-header .search-container {
            transform: translateY(0);
        }
        /* Bottom Navigation Bar Hide/Show on Scroll & Focus */
        #bottom-nav {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #bottom-nav.nav-hidden {
            transform: translateY(150%);
        }
        /* Go to Cart Bar buttery smooth transitions */
        #go-to-cart-bar {
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease !important;
        }

        /* =============================================
           QUICK CART SUMMARY POP-UP STYLES
        ============================================= */

        /* View All button wrapper positioned above the cart bar */
        #view-all-cart-wrapper {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 102;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
        }
        #view-all-cart-wrapper.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* The View All button itself */
        #view-all-cart-btn {
            background: #1A1A1A;
            color: #FFD700;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            border-radius: 20px 20px 0 0;
            padding: 8px 22px 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.18);
            transition: background 0.2s ease, transform 0.15s ease;
            white-space: nowrap;
        }
        #view-all-cart-btn:active {
            transform: scale(0.96);
        }
        #view-all-cart-btn .vab-icon {
            width: 18px;
            height: 18px;
            background: #FFD700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #view-all-cart-btn .vab-icon svg {
            width: 10px;
            height: 10px;
            fill: #1A1A1A;
        }

        /* Backdrop overlay */
        #cart-popup-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 200;
            pointer-events: none;
            transition: background 0.35s ease;
        }
        #cart-popup-backdrop.open {
            background: rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            backdrop-filter: blur(2px);
        }

        /* The drawer itself */
        #cart-popup-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #FFFFFF;
            border-radius: 28px 28px 0 0;
            z-index: 201;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.2);
            transform: translateY(100%);
            transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        #cart-popup-drawer.open {
            transform: translateY(0);
        }

        /* Drag handle */
        .drawer-handle {
            width: 38px;
            height: 4px;
            background: #E0E0E0;
            border-radius: 2px;
            margin: 14px auto 0;
            flex-shrink: 0;
        }

        /* Drawer header */
        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1.5px solid #F5F5F5;
            flex-shrink: 0;
        }
        .drawer-header h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 17px;
            color: #1A1A1A;
            margin: 0;
        }
        .drawer-header .item-count-pill {
            background: #FFF3CC;
            color: #7A5F00;
            font-size: 11px;
            font-weight: 700;
            border-radius: 100px;
            padding: 3px 10px;
            margin-left: 8px;
        }
        .drawer-close-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #F5F5F5;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0;
        }
        .drawer-close-btn:active {
            transform: scale(0.9);
            background: #EBEBEB;
        }
        .drawer-close-btn svg {
            width: 14px;
            height: 14px;
            stroke: #1A1A1A;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        /* Scrollable items list */
        #cart-popup-items-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            scrollbar-width: none;
        }
        #cart-popup-items-list::-webkit-scrollbar {
            display: none;
        }

        /* Individual cart item row */
        .cart-popup-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 20px;
            border-radius: 16px;
            margin: 0 8px 2px;
            transition: background 0.2s ease, opacity 0.28s ease, max-height 0.32s cubic-bezier(0.4, 0, 0.2, 1), padding 0.28s ease, margin 0.28s ease;
            overflow: hidden;
            max-height: 100px;
        }
        .cart-popup-item:active {
            background: #FAF9F7;
        }
        .cart-popup-item.removing {
            opacity: 0;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .cart-popup-item img {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            object-fit: cover;
            background: #F5F5F5;
            flex-shrink: 0;
        }
        .cart-popup-item-info {
            flex: 1;
            min-width: 0;
        }
        .cart-popup-item-info .item-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #1A1A1A;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cart-popup-item-info .item-price {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 12px;
            color: #757575;
            margin-top: 2px;
        }

        /* Inline qty selector */
        .popup-qty-selector {
            display: flex;
            align-items: center;
            background: #FFD700;
            border-radius: 14px;
            padding: 4px 6px;
            gap: 8px;
            flex-shrink: 0;
            box-shadow: 0 2px 10px rgba(255,215,0,0.3);
        }
        .popup-qty-btn {
            width: 26px;
            height: 26px;
            border-radius: 9px;
            background: rgba(0,0,0,0.1);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 13px;
            color: #1A1A1A;
            transition: background 0.15s, transform 0.12s;
            line-height: 1;
        }
        .popup-qty-btn:active {
            background: rgba(0,0,0,0.2);
            transform: scale(0.88);
        }
        .popup-qty-display {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 14px;
            color: #1A1A1A;
            min-width: 18px;
            text-align: center;
        }

        /* Empty state */
        .cart-popup-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            gap: 12px;
            text-align: center;
        }
        .cart-popup-empty .empty-icon {
            width: 72px;
            height: 72px;
            background: #FFF8DC;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .cart-popup-empty h3 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 16px;
            color: #1A1A1A;
            margin: 0;
        }
        .cart-popup-empty p {
            font-size: 12px;
            color: #9E9E9E;
            margin: 0;
            font-weight: 500;
        }

        /* Footer total + checkout button */
        .drawer-footer {
            padding: 14px 20px 28px;
            border-top: 1.5px solid #F5F5F5;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .drawer-footer .total-block {
            display: flex;
            flex-direction: column;
        }
        .drawer-footer .total-label {
            font-size: 10px;
            font-weight: 700;
            color: #9E9E9E;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }
        .drawer-footer .total-amount {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 20px;
            color: #1A1A1A;
            line-height: 1.1;
        }
        .drawer-checkout-btn {
            background: #FFD700;
            color: #1A1A1A;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 13px;
            padding: 14px 24px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(255,215,0,0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            white-space: nowrap;
        }
        .drawer-checkout-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(255,215,0,0.3);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFD700',
                        textDark: '#1A1A1A',
                        textGray: '#757575',
                        bgLight: '#F9F9F9'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white">

    <!-- Sticky Header -->
    <header id="main-header" class="header-yellow px-6 pt-3 pb-2 sticky top-0 z-50 shadow-lg transition-all duration-300 cubic-bezier(0.4, 0, 0.2, 1)">
        <!-- Search Bar -->
        <div id="search-container" class="search-container relative transition-all duration-300">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input type="text" id="search-input" oninput="handleSearch(this.value)" onfocus="enableSearchMode()" onblur="handleSearchBlur()" placeholder="Search for products..." class="w-full bg-white rounded-2xl py-3 pl-12 pr-16 shadow-xl shadow-black/5 outline-none text-sm font-medium placeholder:text-gray-400 transition-all duration-300">
            <button id="cancel-search-btn" onclick="cancelSearchMode()" class="absolute right-4 top-1/2 -translate-y-1/2 text-brown-900 font-bold text-xs bg-amber-100 hover:bg-amber-200 px-3 py-1.5 rounded-xl hidden transition-all active:scale-95 shadow-sm">Cancel</button>
        </div>

        <div id="header-top-row" class="flex items-center justify-between mt-2 mb-0 transition-all duration-300 overflow-hidden">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                    <i class="fa-solid fa-location-dot text-white text-sm"></i>
                </div>
                <div>
                    <span class="text-[10px] font-bold text-black/60 uppercase tracking-widest block">Vendor Location</span>
                    <p id="vendor-address" class="text-sm font-black text-black">Fetching location...</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- Orders -->
                <button onclick="window.location.href='grocery_order_history.html'" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-black" title="Orders">
                    <i class="fa-solid fa-receipt"></i>
                </button>
                <!-- Cart -->
                <button onclick="window.location.href='cart.html'" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-black">
                    <i class="fa-solid fa-cart-shopping"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="pt-12 pb-32 px-6">
        <!-- Categories Section -->
        <div class="mb-8">
            <div class="mb-4">
                <h2 class="text-lg font-black text-textDark">Categories</h2>
            </div>
            <div class="category-scroll no-scrollbar gap-4">
                <!-- All Items -->
                <div class="category-card cursor-pointer group" onclick="selectCategory('All')">
                    <div id="cat-icon-All" class="w-16 h-16 bg-primary/20 border-2 border-primary rounded-2xl flex items-center justify-center mx-auto mb-2 shadow-md transition-all group-active:scale-95">
                        <i class="fa-solid fa-border-all text-2xl text-amber-600"></i>
                    </div>
                    <span class="text-[10px] font-bold text-textDark leading-tight block">All Items</span>
                </div>
                <!-- Fruits & Vegetables -->
                <div class="category-card cursor-pointer group" onclick="selectCategory('Fruits & Vegetables')">
                    <div id="cat-icon-Fruits-&-Vegetables" class="w-16 h-16 bg-[#FDF7E2] rounded-2xl flex items-center justify-center mx-auto mb-2 border border-primary/10 transition-all group-active:scale-95">
                        <img src="https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=100&q=80" class="w-10 h-10 object-contain rounded-lg">
                    </div>
                    <span class="text-[10px] font-bold text-textDark leading-tight block">Fruits & Vegetables</span>
                </div>
                <!-- Rice & Grains -->
                <div class="category-card cursor-pointer group" onclick="selectCategory('Rice & Grains')">
                    <div id="cat-icon-Rice-&-Grains" class="w-16 h-16 bg-[#FDF7E2] rounded-2xl flex items-center justify-center mx-auto mb-2 border border-primary/10 transition-all group-active:scale-95">
                        <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?w=100&q=80" class="w-10 h-10 object-contain rounded-lg">
                    </div>
                    <span class="text-[10px] font-bold text-textDark leading-tight block">Rice & Grains</span>
                </div>
                <!-- Oil & Masala -->
                <div class="category-card cursor-pointer group" onclick="selectCategory('Oil & Masala')">
                    <div id="cat-icon-Oil-&-Masala" class="w-16 h-16 bg-[#FDF7E2] rounded-2xl flex items-center justify-center mx-auto mb-2 border border-primary/10 transition-all group-active:scale-95">
                        <img src="https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=100&q=80" class="w-10 h-10 object-contain rounded-lg">
                    </div>
                    <span class="text-[10px] font-bold text-textDark leading-tight block">Oil & Masala</span>
                </div>
                <!-- Dairy & Eggs -->
                <div class="category-card cursor-pointer group" onclick="selectCategory('Dairy & Eggs')">
                    <div id="cat-icon-Dairy-&-Eggs" class="w-16 h-16 bg-[#FDF7E2] rounded-2xl flex items-center justify-center mx-auto mb-2 border border-primary/10 transition-all group-active:scale-95">
                        <img src="https://images.unsplash.com/photo-1550583724-b2692b85b150?w=100&q=80" class="w-10 h-10 object-contain rounded-lg">
                    </div>
                    <span class="text-[10px] font-bold text-textDark leading-tight block">Dairy & Eggs</span>
                </div>
                <!-- Snacks & Beverages -->
                <div class="category-card cursor-pointer group" onclick="selectCategory('Snacks & Beverages')">
                    <div id="cat-icon-Snacks-&-Beverages" class="w-16 h-16 bg-[#FDF7E2] rounded-2xl flex items-center justify-center mx-auto mb-2 border border-primary/10 transition-all group-active:scale-95">
                        <img src="https://images.unsplash.com/photo-1563227812-0ea4c22e6cc8?w=100&q=80" class="w-10 h-10 object-contain rounded-lg">
                    </div>
                    <span class="text-[10px] font-bold text-textDark leading-tight block">Snacks & Beverages</span>
                </div>
                <!-- Personal Care -->
                <div class="category-card cursor-pointer group" onclick="selectCategory('Personal Care')">
                    <div id="cat-icon-Personal-Care" class="w-16 h-16 bg-[#FDF7E2] rounded-2xl flex items-center justify-center mx-auto mb-2 border border-primary/10 transition-all group-active:scale-95">
                        <img src="https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?w=100&q=80" class="w-10 h-10 object-contain rounded-lg">
                    </div>
                    <span class="text-[10px] font-bold text-textDark leading-tight block">Personal Care</span>
                </div>
            </div>
        </div>

        <!-- Items Section -->
        <div>
            <div class="flex items-center justify-between mb-4">
                <h2 id="current-category-title" class="text-lg font-black text-textDark">All Items</h2>
                <span id="items-count-badge" class="text-xs font-bold text-textGray bg-gray-100 px-2.5 py-1 rounded-full">10 items</span>
            </div>
            <div id="products-grid" class="grid grid-cols-2 gap-4">
                <!-- Products injected dynamically here -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav id="bottom-nav" class="fixed bottom-4 left-2 right-2 h-20 bg-[#3E2723] rounded-[32px] shadow-2xl flex items-center justify-around px-2 z-[100] transition-all duration-500 translate-y-0">
        <button onclick="window.location.href='index.html?view=home'" class="nav-item flex flex-col items-center justify-center flex-1 h-14 rounded-2xl transition-all duration-300 relative text-white/40">
            <i class="fa-solid fa-house text-lg mb-1"></i>
            <span class="text-[9px] font-black uppercase tracking-wider whitespace-nowrap">Home</span>
            <div class="active-bar absolute -bottom-1 w-4 h-1 bg-primary rounded-full opacity-0 transition-all"></div>
        </button>
        <button class="nav-item flex flex-col items-center justify-center flex-1 h-14 rounded-2xl transition-all duration-300 relative bg-[#FFD700] text-black shadow-md">
            <i class="fa-solid fa-basket-shopping text-lg mb-1"></i>
            <span class="text-[9px] font-black uppercase tracking-wider whitespace-nowrap">Grocery</span>
            <div class="active-bar absolute -bottom-1 w-4 h-1 bg-black rounded-full transition-all"></div>
        </button>
        <button onclick="window.location.href='index.html?view=status'" class="nav-item flex flex-col items-center justify-center flex-1 h-14 rounded-2xl transition-all duration-300 relative text-white/40">
            <i class="fa-solid fa-shop text-lg mb-1"></i>
            <span class="text-[9px] font-black uppercase tracking-wider whitespace-nowrap">Restaurant</span>
            <div class="active-bar absolute -bottom-1 w-4 h-1 bg-primary rounded-full opacity-0 transition-all"></div>
        </button>
        <button onclick="window.location.href='index.html?view=menu'" class="nav-item flex flex-col items-center justify-center flex-1 h-14 rounded-2xl transition-all duration-300 relative text-white/40">
            <i class="fa-solid fa-bell-concierge text-lg mb-1"></i>
            <span class="text-[9px] font-black uppercase tracking-wider whitespace-nowrap">Menu</span>
            <div class="active-bar absolute -bottom-1 w-4 h-1 bg-primary rounded-full opacity-0 transition-all"></div>
        </button>
        <button onclick="window.location.href='index.html?view=profile'" class="nav-item flex flex-col items-center justify-center flex-1 h-14 rounded-2xl transition-all duration-300 relative text-white/40">
            <i class="fa-solid fa-user-large text-lg mb-1"></i>
            <span class="text-[9px] font-black uppercase tracking-wider whitespace-nowrap">Profile</span>
            <div class="active-bar absolute -bottom-1 w-4 h-1 bg-primary rounded-full opacity-0 transition-all"></div>
        </button>
    </nav>

    <!-- View All Cart Button (sits tightly above the Go to Cart bar, tab-style) -->
    <div id="view-all-cart-wrapper">
        <button id="view-all-cart-btn" onclick="openCartPopup()" aria-label="View all cart items" aria-haspopup="dialog">
            <span class="vab-icon">
                <!-- Chevron up icon -->
                <svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
                    <polyline points="2,8 6,4 10,8" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        </button>
    </div>

    <!-- Go to Cart Bar -->
    <div id="go-to-cart-bar" class="fixed bottom-24 left-4 right-4 bg-primary text-black p-4 rounded-2xl shadow-2xl z-[101] flex items-center justify-between transform translate-y-32 transition-all duration-500 opacity-0">
        <div class="flex items-center gap-3">

                <p id="cart-count-text" class="text-sm font-black">1 Item added</p>
                <p class="text-[10px] font-bold opacity-60">View your cart to checkout</p>
            </div>
        </div>
        <button onclick="if(canOrderGrocery) window.location.href='checkout.html'; else alert('Grocery ordering is currently restricted by admin.');" class="bg-black text-white px-6 py-3 rounded-xl font-black text-xs active:scale-95 transition-all shadow-lg">
            Go to Cart
        </button>
    </div>

    <!-- Quick Cart Summary Pop-up Backdrop -->
    <div id="cart-popup-backdrop" onclick="closeCartPopup()" role="presentation"></div>

    <!-- Quick Cart Summary Pop-up Drawer -->
    <div id="cart-popup-drawer" role="dialog" aria-modal="true" aria-label="Cart Summary">
        <div class="drawer-handle" aria-hidden="true"></div>

        <!-- Drawer Header -->
        <div class="drawer-header">
            <div style="display:flex;align-items:center;gap:0">
                <h2>My Cart</h2>
                <span class="item-count-pill" id="popup-item-count-pill">0 items</span>
            </div>
            <button class="drawer-close-btn" onclick="closeCartPopup()" aria-label="Close cart summary">
                <!-- X icon -->
                <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="2" y1="2" x2="12" y2="12"/>
                    <line x1="12" y1="2" x2="2" y2="12"/>
                </svg>
            </button>
        </div>

        <!-- Items List -->
        <div id="cart-popup-items-list" role="list"></div>

        <!-- Footer -->
        <div class="drawer-footer" id="cart-popup-footer">
            <div class="total-block">
                <span class="total-label">Total</span>
                <span class="total-amount" id="popup-total-amount">₹ 0</span>
            </div>
            <button class="drawer-checkout-btn" onclick="if(canOrderGrocery) window.location.href='checkout.html'; else alert('Grocery ordering is currently restricted by admin.');">
                <i class="fa-solid fa-bag-shopping" style="font-size:14px"></i>
                Checkout
            </button>
        </div>
    </div>

    <!-- Cart Toast -->
    <div id="cart-toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-3 rounded-full text-xs font-bold shadow-2xl z-[101] opacity-0 translate-y-10 transition-all duration-300 pointer-events-none">
        Added to Cart!
    </div>

    <script>
        const supabaseClient = window.supabaseClient;

        let cartItems = JSON.parse(localStorage.getItem('groceryCart')) || [];
        let currentCategory = 'All';
        let searchQuery = '';

        // Comprehensive Product Catalog with Categories and Descriptions (Fallback Data)
        let groceryProducts = [
            {
                id: 'Tomato',
                name: 'Tomato',
                price: 40,
                originalPrice: 60,
                unit: '1 kg',

            },
            {

            },
            {

            },
            {
                id: 'Onion',
                name: 'Onion',
                price: 30,
                originalPrice: 45,
                unit: '1 kg',
                category: 'Fruits & Vegetables',
                image: 'https://images.unsplash.com/photo-1508747703725-719777637510?w=400&q=80',
                desc: 'Quality red onions with strong pungent flavor, essential kitchen staple for every dish.'
            },
            {
                id: 'Potato',
                name: 'Potato',
                price: 25,
                originalPrice: 35,
                unit: '1 kg',
                category: 'Fruits & Vegetables',
                image: 'https://images.unsplash.com/photo-1518977676601-b53f02ac6d31?w=400&q=80',
                desc: 'Fresh large versatile potatoes, excellent for boiling, baking, frying, and rich curries.'
            },
            {
                id: 'Maggi',
                name: 'Maggi 2-Minute',
                price: 15,
                originalPrice: 20,
                unit: '70 g',

            },
            {
                id: 'Milk',
                name: 'Amul Toned Milk',
                price: 60,
                originalPrice: 75,
                unit: '1 Ltr',
                category: 'Dairy & Eggs',
                image: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400&q=80',
                desc: 'Pasteurized toned milk, rich in calcium and vitamin D, perfect for family health and tea.'
            },
            {
                id: 'Dettol Soap',
                name: 'Dettol Handwash',
                price: 99,
                originalPrice: 120,
                unit: '200 ml',
                category: 'Personal Care',
                image: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=400&q=80',
                desc: 'Germ protection liquid handwash soap, keeps hands hygienically clean, soft, and refreshed.'
            },
            {
                id: 'Colgate',
                name: 'Colgate Toothpaste',
                price: 85,
                originalPrice: 100,
                unit: '150 g',
                category: 'Personal Care',
                image: 'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400&q=80',
                desc: 'Strong teeth cavity protection toothpaste with refreshing cool mint flavor for fresh breath.'
            }
        ];

        let canOrderGrocery = false;

        async function fetchSupabaseData() {
            try {
                // Check if grocery ordering is restricted via system settings
                const { data: sysSettings, error: sysError } = await supabaseClient
                    .from('system_settings')
                    .select('is_grocery_order_restricted')
                    .single();
                
                if (!sysError && sysSettings) {
                    canOrderGrocery = sysSettings.is_grocery_order_restricted === true;
                } else {
                    canOrderGrocery = false; // default to false if error or not found
                }

                // Fetch categories
                const { data: catData, error: catError } = await supabaseClient
                    .from('grocery_categories')
                    .select('*')
                    .eq('is_active', true)
                    .order('priority_order', { ascending: true });

                if (!catError && catData && catData.length > 0) {
                    renderCategoriesUI(catData);
                }

                // Fetch products
                const { data: itemData, error: itemError } = await supabaseClient
                    .from('grocery_items')
                    .select('*')
                    .eq('is_available', true);

                if (!itemError && itemData && itemData.length > 0) {
                    groceryProducts = itemData.map(item => ({
                        id: item.id,
                        name: item.name,
                        price: Number(item.price),
                        originalPrice: Number(item.original_price),
                        unit: item.unit,
                        category: item.category,
                        image: item.image_url,
                        desc: item.description || ''
                    }));
                }
            } catch (err) {
                console.error('Supabase fetch error:', err);
            }
            
            selectCategory('All');
            updateCartUI();
            fetchVendorLocation();
        }

        function renderCategoriesUI(categories) {
            const container = document.querySelector('.category-scroll');
            if (!container) return;
            
            let html = `
                <div class="category-card cursor-pointer group" onclick="selectCategory('All')">
                    <div id="cat-icon-All" class="w-16 h-16 bg-primary/20 border-2 border-primary rounded-2xl flex items-center justify-center mx-auto mb-2 shadow-md transition-all group-active:scale-95">
                        <i class="fa-solid fa-border-all text-2xl text-amber-600"></i>
                    </div>
                    <span class="text-[10px] font-bold text-textDark leading-tight block">All Items</span>
                </div>
            `;
            
            categories.forEach(cat => {
                const elId = `cat-icon-${cat.name.replace(/\s+/g, '-').replace(/&/g, '&')}`;
                html += `
                    <div class="category-card cursor-pointer group" onclick="selectCategory('${cat.name}')">
                        <div id="${elId}" class="w-16 h-16 bg-[#FDF7E2] rounded-2xl flex items-center justify-center mx-auto mb-2 border border-primary/10 transition-all group-active:scale-95">
                            <img src="${cat.image_url}" class="w-10 h-10 object-contain rounded-lg">
                        </div>
                        <span class="text-[10px] font-bold text-textDark leading-tight block">${cat.name}</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function selectCategory(category) {
            currentCategory = category;
            
            // Update visual active states on category cards
            document.querySelectorAll('.category-card div').forEach(el => {
                if (el.id === `cat-icon-${category.replace(/\s+/g, '-').replace(/&/g, '&')}`) {
                    el.className = "w-16 h-16 bg-primary/20 border-2 border-primary rounded-2xl flex items-center justify-center mx-auto mb-2 shadow-md transition-all group-active:scale-95";
                } else {
                    el.className = "w-16 h-16 bg-[#FDF7E2] rounded-2xl flex items-center justify-center mx-auto mb-2 border border-primary/10 transition-all group-active:scale-95";
                }
            });

            // Update Section Title
            const titleEl = document.getElementById('current-category-title');
            if (titleEl) titleEl.innerText = category === 'All' ? 'All Items' : category;

            renderProducts();
        }

        function handleSearch(query) {
            searchQuery = query.toLowerCase().trim();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const countBadge = document.getElementById('items-count-badge');

            // Combined Search & Filter Logic
            const filtered = groceryProducts.filter(product => {
                const matchesCategory = currentCategory === 'All' || product.category === currentCategory;
                const matchesSearch = searchQuery === '' || 
                    product.name.toLowerCase().includes(searchQuery) || 
                    product.desc.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            countBadge.innerText = `${filtered.length} item${filtered.length === 1 ? '' : 's'}`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-2 py-16 text-center animate-fade-in">
                        <div class="w-20 h-20 bg-amber-50 rounded-full flex items-center justify-center mx-auto mb-4 text-amber-500 text-3xl shadow-inner">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <h3 class="text-lg font-black text-brown-900 mb-1">No products found</h3>
                        <p class="text-xs text-brown-500 max-w-xs mx-auto">We couldn't find any items matching your search in this category.</p>
                        <button onclick="resetFilters()" class="mt-6 px-6 py-3 bg-primary text-brown-900 font-black text-xs rounded-xl shadow-lg active:scale-95 transition-all">
                            Reset Filters
                        </button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(product => {
                const cartItem = cartItems.find(i => i.name === product.name);
                const qty = cartItem ? cartItem.qty : 0;
                
                return `
                    <div class="product-card flex flex-col justify-between animate-fade-in">
                        <div>
                            <div class="aspect-square rounded-xl bg-gray-50 overflow-hidden mb-3 relative group">
                                <img src="${product.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                <span class="absolute top-2 left-2 bg-white/90 backdrop-blur-sm text-[9px] font-black px-2 py-0.5 rounded-md text-brown-900 shadow-sm">
                                    ${product.category.split(' ')[0]}
                                </span>
                            </div>
                            <h3 class="text-sm font-black text-textDark mb-0.5 leading-snug">${product.name}</h3>
                            <p class="text-[10px] text-textGray font-bold mb-1">${product.unit}</p>
                            <p class="text-[10px] text-gray-400 line-clamp-2 mb-4 leading-tight h-7">${product.desc}</p>
                        </div>
                        <div class="flex items-end justify-between pt-2 border-t border-gray-50">
                            <div>
                                <p class="text-base font-black text-textDark leading-none mb-1">₹ ${product.price}</p>
                                <p class="text-[10px] text-textGray font-bold line-through">₹ ${product.originalPrice}</p>
                            </div>
                            ${!canOrderGrocery ? `
                                <button class="add-btn flex items-center justify-center opacity-50 cursor-not-allowed" style="background-color: #e5e7eb;" onclick="alert('Grocery ordering is currently restricted by admin.')">
                                    <i class="fa-solid fa-lock text-gray-500"></i>
                                </button>
                            ` : (qty > 0 ? `
                                <div class="flex items-center bg-primary rounded-xl p-1 shadow-md gap-2 animate-fade-in">
                                    <button onclick="updateProductQty('${product.id}', -1)" class="w-6 h-6 rounded-lg bg-black/10 flex items-center justify-center text-brown-900 active:scale-95 transition-all text-xs font-bold">
                                        <i class="fa-solid fa-minus"></i>
                                    </button>
                                    <span class="text-xs font-black text-brown-900 px-1">${qty}</span>
                                    <button onclick="updateProductQty('${product.id}', 1)" class="w-6 h-6 rounded-lg bg-black/10 flex items-center justify-center text-brown-900 active:scale-95 transition-all text-xs font-bold">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            ` : `
                                <button onclick="addToCart('${product.id}')" class="add-btn active:scale-90 transition-all flex items-center justify-center">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            `)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resetFilters() {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            selectCategory('All');
        }

        function addToCart(itemId) {
            const product = groceryProducts.find(p => p.id === itemId);
            if (!product) return;

            const existing = cartItems.find(i => i.name === product.name);
            
            if (existing) {
                existing.qty++;
            } else {
                cartItems.push({ name: product.name, price: product.price, image: product.image, qty: 1 });
            }

            localStorage.setItem('groceryCart', JSON.stringify(cartItems));
            updateCartUI();
            renderProducts();
            
            // Show brief toast
            const toast = document.getElementById('cart-toast');
            toast.innerText = `${product.name} added to cart!`;
            toast.classList.remove('opacity-0', 'translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-10');
            }, 1500);
        }

        function updateProductQty(itemId, delta) {
            const product = groceryProducts.find(p => p.id === itemId);
            if (!product) return;

            const existingIndex = cartItems.findIndex(i => i.name === product.name);
            if (existingIndex !== -1) {
                cartItems[existingIndex].qty += delta;
                if (cartItems[existingIndex].qty < 1) {
                    cartItems.splice(existingIndex, 1);
                }
                localStorage.setItem('groceryCart', JSON.stringify(cartItems));
                updateCartUI();
                renderProducts();
            }
        }

        function updateCartUI() {
            const bar = document.getElementById('go-to-cart-bar');
            const countText = document.getElementById('cart-count-text');
            const bottomNav = document.getElementById('bottom-nav');
            const viewAllWrapper = document.getElementById('view-all-cart-wrapper');
            const viewAllBadge = document.getElementById('view-all-badge');
            
            if (cartItems.length > 0) {
                const totalItems = cartItems.reduce((acc, i) => acc + i.qty, 0);
                countText.innerText = `${totalItems} Item${totalItems > 1 ? 's' : ''} added`;
                if (viewAllBadge) viewAllBadge.textContent = totalItems;
                
                // Position dynamically above bottom-nav or sticky to bottom
                const navHidden = bottomNav && bottomNav.classList.contains('nav-hidden');
                const cartBarBottom = navHidden ? 16 : 96; // px

                if (navHidden) {
                    bar.style.bottom = '16px';
                } else {
                    bar.style.bottom = '96px';
                }

                bar.classList.remove('translate-y-32', 'opacity-0');
                bar.classList.add('translate-y-0', 'opacity-100');

                // Position the View All button: it sits at the top edge of the cart bar
                // Cart bar height ~72px, plus its bottom offset
                const cartBarEl = document.getElementById('go-to-cart-bar');
                const cartBarHeight = cartBarEl ? cartBarEl.offsetHeight : 72;
                const viewAllBottom = cartBarBottom + cartBarHeight; // sits right on top
                if (viewAllWrapper) {
                    viewAllWrapper.style.bottom = viewAllBottom + 'px';
                    viewAllWrapper.classList.add('visible');
                }
            } else {
                bar.classList.add('translate-y-32', 'opacity-0');
                bar.classList.remove('translate-y-0', 'opacity-100');
                if (viewAllWrapper) {
                    viewAllWrapper.classList.remove('visible');
                }
                if (viewAllBadge) viewAllBadge.textContent = '0';
                // Close popup if open and cart is empty
                if (cartPopupOpen) closeCartPopup();
            }
        }

        /* =============================================
           QUICK CART POP-UP LOGIC
        ============================================= */
        let cartPopupOpen = false;

        function openCartPopup() {
            cartPopupOpen = true;
            renderCartPopup();
            document.getElementById('cart-popup-backdrop').classList.add('open');
            // Slight delay so the transition fires after display
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.getElementById('cart-popup-drawer').classList.add('open');
                });
            });
            // Prevent background scroll
            document.body.style.overflow = 'hidden';
            // Push history for back-button close
            if (!history.state || !history.state.cartPopup) {
                history.pushState({ cartPopup: true }, '');
            }
        }

        function closeCartPopup() {
            cartPopupOpen = false;
            document.getElementById('cart-popup-drawer').classList.remove('open');
            document.getElementById('cart-popup-backdrop').classList.remove('open');
            document.body.style.overflow = '';
            if (history.state && history.state.cartPopup) {
                history.back();
            }
        }

        function renderCartPopup() {
            const list = document.getElementById('cart-popup-items-list');
            const pill = document.getElementById('popup-item-count-pill');
            const totalEl = document.getElementById('popup-total-amount');
            const footer = document.getElementById('cart-popup-footer');

            if (!list) return;

            if (cartItems.length === 0) {
                list.innerHTML = `
                    <div class="cart-popup-empty">
                        <div class="empty-icon">🛒</div>
                        <h3>Your cart is empty</h3>
                        <p>Add items from the grocery section<br>to see them here.</p>
                    </div>
                `;
                if (pill) pill.textContent = '0 items';
                if (totalEl) totalEl.textContent = '₹ 0';
                if (footer) footer.style.display = 'none';
                return;
            }

            if (footer) footer.style.display = 'flex';

            const totalQty = cartItems.reduce((acc, i) => acc + i.qty, 0);
            const totalPrice = cartItems.reduce((acc, i) => acc + (i.price * i.qty), 0);

            if (pill) pill.textContent = `${totalQty} item${totalQty !== 1 ? 's' : ''}`;
            if (totalEl) totalEl.textContent = `₹ ${totalPrice.toLocaleString('en-IN')}`;

            list.innerHTML = cartItems.map((item, idx) => `
                <div class="cart-popup-item" id="popup-item-${idx}" role="listitem">
                    <img src="${item.image || 'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=100&q=80'}" alt="${item.name}" loading="lazy">
                    <div class="cart-popup-item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">₹ ${item.price} × ${item.qty} = <strong style="color:#1A1A1A">₹ ${(item.price * item.qty).toLocaleString('en-IN')}</strong></div>
                    </div>
                    <div class="popup-qty-selector" role="group" aria-label="Quantity for ${item.name}">
                        <button class="popup-qty-btn" onclick="popupUpdateQty(${idx}, -1)" aria-label="Decrease quantity">−</button>
                        <span class="popup-qty-display" id="popup-qty-${idx}">${item.qty}</span>
                        <button class="popup-qty-btn" onclick="popupUpdateQty(${idx}, 1)" aria-label="Increase quantity">+</button>
                    </div>
                </div>
            `).join('');
        }

        function popupUpdateQty(idx, delta) {
            if (idx < 0 || idx >= cartItems.length) return;

            const newQty = cartItems[idx].qty + delta;

            if (newQty < 1) {
                // Animate removal
                const rowEl = document.getElementById(`popup-item-${idx}`);
                if (rowEl) {
                    rowEl.classList.add('removing');
                    setTimeout(() => {
                        cartItems.splice(idx, 1);
                        localStorage.setItem('groceryCart', JSON.stringify(cartItems));
                        updateCartUI();
                        renderProducts();
                        renderCartPopup();
                    }, 320); // matches CSS transition duration
                } else {
                    cartItems.splice(idx, 1);
                    localStorage.setItem('groceryCart', JSON.stringify(cartItems));
                    updateCartUI();
                    renderProducts();
                    renderCartPopup();
                }
            } else {
                cartItems[idx].qty = newQty;
                localStorage.setItem('groceryCart', JSON.stringify(cartItems));

                // Reactively update just the changed elements (no full re-render)
                const qtyEl = document.getElementById(`popup-qty-${idx}`);
                if (qtyEl) qtyEl.textContent = newQty;

                // Update item subtotal label
                const itemRow = document.getElementById(`popup-item-${idx}`);
                if (itemRow) {
                    const priceEl = itemRow.querySelector('.item-price');
                    if (priceEl) {
                        const item = cartItems[idx];
                        priceEl.innerHTML = `₹ ${item.price} × ${newQty} = <strong style="color:#1A1A1A">₹ ${(item.price * newQty).toLocaleString('en-IN')}</strong>`;
                    }
                }

                // Update totals and badge
                updateCartUI();
                renderProducts();

                // Refresh total in popup footer
                const totalQty = cartItems.reduce((acc, i) => acc + i.qty, 0);
                const totalPrice = cartItems.reduce((acc, i) => acc + (i.price * i.qty), 0);
                const totalEl = document.getElementById('popup-total-amount');
                const pill = document.getElementById('popup-item-count-pill');
                if (totalEl) totalEl.textContent = `₹ ${totalPrice.toLocaleString('en-IN')}`;
                if (pill) pill.textContent = `${totalQty} item${totalQty !== 1 ? 's' : ''}`;
            }
        }

        async function fetchVendorLocation() {
            try {
                const sessionStr = localStorage.getItem('asa_vendor_session');
                let vendorId = '';
                if (sessionStr) {
                    const session = JSON.parse(sessionStr);
                    vendorId = session.currentVendorId || '';
                }

                if (!vendorId) {
                    document.getElementById('vendor-address').innerText = "Session expired. Please log in.";
                    return;
                }

                const client = window.supabaseClient || window.supabase;
                if (!client) {
                    document.getElementById('vendor-address').innerText = "System connection error.";
                    return;
                }

                // Clean secure Supabase query
                const { data, error } = await client
                    .from('vendors')
                    .select('lat, lng, address')
                    .eq('id', vendorId)
                    .single();

                if (error || !data) {
                    document.getElementById('vendor-address').innerText = "Address not found";
                    return;
                }

                // Render address string if available, otherwise fallback to raw coordinates
                if (data.address && data.address.trim() !== '') {
                    document.getElementById('vendor-address').innerText = data.address;
                } else if (data.lat && data.lng) {
                    document.getElementById('vendor-address').innerText = `Lat: ${data.lat}, Lng: ${data.lng}`;
                } else {
                    document.getElementById('vendor-address').innerText = "Location not set";
                }
            } catch (err) {
                console.error("Failed to fetch vendor location from Supabase", err);
                document.getElementById('vendor-address').innerText = "Location sync failed";
            }
        }

        // Advanced Search & Scroll Behavior Logic
        let isSearchFocused = false;
        let lastScrollTop = 0;

        function enableSearchMode() {
            isSearchFocused = true;
            document.getElementById('main-header').classList.add('active-header');
            document.getElementById('bottom-nav').classList.add('nav-hidden');
            document.getElementById('cancel-search-btn').classList.remove('hidden');
            
            const cartBar = document.getElementById('go-to-cart-bar');
            if (cartBar) {
                cartBar.style.bottom = '16px';
            }
            
            // Push history state for back button handling
            if (!history.state || !history.state.searchMode) {
                history.pushState({ searchMode: true }, '');
            }
        }

        function cancelSearchMode() {
            isSearchFocused = false;
            const input = document.getElementById('search-input');
            input.value = '';
            input.blur();
            searchQuery = '';
            renderProducts();

            document.getElementById('main-header').classList.remove('active-header');
            document.getElementById('bottom-nav').classList.remove('nav-hidden');
            document.getElementById('cancel-search-btn').classList.add('hidden');

            const cartBar = document.getElementById('go-to-cart-bar');
            if (cartBar) {
                cartBar.style.bottom = '96px';
            }

            if (history.state && history.state.searchMode) {
                history.back();
            }
        }

        function handleSearchBlur() {
            // Delay slightly to allow click events on Cancel button or Add to Cart to process first
            setTimeout(() => {
                const input = document.getElementById('search-input');
                if (document.activeElement !== input) {
                    isSearchFocused = false;
                    document.getElementById('main-header').classList.remove('active-header');
                    document.getElementById('bottom-nav').classList.remove('nav-hidden');
                    document.getElementById('cancel-search-btn').classList.add('hidden');
                    
                    const cartBar = document.getElementById('go-to-cart-bar');
                    if (cartBar) {
                        cartBar.style.bottom = '96px';
                    }
                }
            }, 150);
        }

        window.addEventListener('popstate', (event) => {
            if (cartPopupOpen) {
                // Close the cart popup on back button
                cartPopupOpen = false;
                document.getElementById('cart-popup-drawer').classList.remove('open');
                document.getElementById('cart-popup-backdrop').classList.remove('open');
                document.body.style.overflow = '';
                return;
            }
            if (isSearchFocused) {
                isSearchFocused = false;
                const input = document.getElementById('search-input');
                input.blur();
                document.getElementById('main-header').classList.remove('active-header');
                document.getElementById('bottom-nav').classList.remove('nav-hidden');
                document.getElementById('cancel-search-btn').classList.add('hidden');
                
                const cartBar = document.getElementById('go-to-cart-bar');
                if (cartBar) {
                    cartBar.style.bottom = '96px';
                }
            }
        });

        window.addEventListener('scroll', () => {
            if (isSearchFocused) return; // Keep hidden while search is focused

            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const bottomNav = document.getElementById('bottom-nav');
            const mainHeader = document.getElementById('main-header');
            const cartBar = document.getElementById('go-to-cart-bar');

            if (scrollTop > lastScrollTop && scrollTop > 50) {
                // Scrolling down - Hide Bottom Nav and slide cart bar to bottom
                bottomNav.classList.add('nav-hidden');
                if (cartBar) {
                    cartBar.style.bottom = '16px';
                }
            } else if (scrollTop < lastScrollTop) {
                // Scrolling up - Show Bottom Nav and slide cart bar above it
                bottomNav.classList.remove('nav-hidden');
                if (cartBar) {
                    cartBar.style.bottom = '96px';
                }
            }

            // Collapsing Header Logic: Collapse when scrolling down past 50px, expand when back at absolute top (scrollTop < 20)
            if (scrollTop > 50) {
                mainHeader.classList.add('active-header');
            } else if (scrollTop < 20) {
                mainHeader.classList.remove('active-header');
            }

            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }, { passive: true });

        window.onload = () => {
            fetchSupabaseData();
        };
    </script>

    <!-- ════════════════════════════════════════════════════════════
         NEW ORDER NOTIFICATION SIREN
         Audio streamed from a hosted URL — no local files needed.
         The JS below polls check_new_orders.php every 10 seconds.
         If a new pending order is detected, the siren plays automatically.
    ════════════════════════════════════════════════════════════ -->
    <audio id="orderSiren" preload="auto" style="display:none;" aria-hidden="true">
        <source src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <script>
    /* ──────────────────────────────────────────────────────────────
       ORDER SIREN — Supabase Realtime Logic (Grocery Dashboard)
       Subscribes to 'orders' table inserts via Supabase Realtime.
       Plays #orderSiren immediately when a new order arrives.
    ────────────────────────────────────────────────────────────── */
    (function initRealtimeOrderSiren() {
        const siren = document.getElementById('orderSiren');
        if (!siren) {
            console.warn('[OrderSiren] Audio element #orderSiren not found.');
            return;
        }

        if (typeof window.supabaseClient === 'undefined') {
            console.warn('[OrderSiren] Supabase client not found. Cannot initialize realtime siren.');
            return;
        }

        console.info('[OrderSiren] 🚀 Subscribing to real-time orders table for new orders...');

        window.supabaseClient
            .channel('public:orders:siren')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
                console.info(`[OrderSiren] 🔔 New order detected via Realtime! Order ID: ${payload.new.id}`);
                
                siren.currentTime = 0;
                const playPromise = siren.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        console.warn('[OrderSiren] ⚠️ Autoplay blocked by browser. User interaction required.', err.message);
                    });
                }
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    console.info('[OrderSiren] ✅ Successfully connected to Supabase Realtime.');
                }
            });
    })();
    </script>
